{{- if and .Values.httpRoute.enabled .Values.wellKnown.delegation.enabled }}
# /.well-known/matrix/ on the server_name host, so @user:{{ .Values.serverName }}
# resolves to the homeserver on {{ .Values.hostname }}. Only these paths are
# claimed on that host; Tuwunel answers them from its [global.well_known] config.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tuwunel.fullname" . }}-well-known
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      {{- with .Values.wellKnown.delegation.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ default .Values.serverName .Values.wellKnown.delegation.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix/
      backendRefs:
        - name: {{ include "tuwunel.fullname" . }}
          port: {{ .Values.port }}
{{- end }}
