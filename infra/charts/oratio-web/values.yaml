# oratio web client.
#
# Required: image.tag, homeserverUrl, and hostname while httpRoute.enabled
# (the default).

image:
  registry: ghcr.io
  repository: losol/oratio-web
  # Required. oratio CI publishes main-<sha> for every merge to main; there is
  # no moving tag such as :main or :latest.
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicas: 1

# Where the app is served, e.g. chat.example.org. Used by the HTTPRoute only;
# leave it empty when httpRoute.enabled is false and the Service is exposed
# some other way.
hostname: ""

# The Matrix homeserver the app talks to, e.g. https://matrix.example.org.
# Goes into /config.json and the Content-Security-Policy.
homeserverUrl: ""

httpRoute:
  enabled: true
  gateway:
    name: traefik-gateway
    namespace: traefik
    sectionName: ""

podAnnotations: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
