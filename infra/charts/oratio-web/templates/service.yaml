apiVersion: v1
kind: Service
metadata:
  name: {{ include "oratio-web.fullname" . }}
  labels:
    {{- include "oratio-web.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "oratio-web.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
