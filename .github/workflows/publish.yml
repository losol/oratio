# Publishes one package version to npm from its release tag, with
# provenance. release.yml dispatches this for every tag it creates; run it
# by hand to retry a publish.
#
# Authenticates with npm trusted publishing (OIDC), so no npm token is
# stored. Each package lists this workflow and the npm environment as its
# trusted publisher on npmjs.com.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. @eventuras/oratio-core@0.1.0'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve package
        id: package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The whole tag, as changesets writes it: package@semver.
          PATTERN='^(@eventuras/oratio-(core|react))@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $PATTERN ]]; then
            echo "::error::Not a release tag of a published package: ${TAG}"
            exit 1
          fi
          echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      # A version published by hand, like the first release of each package,
      # is already there: npm refuses to publish it again, so skip it.
      - name: Check npm
        id: npm
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if npm view "$TAG" version >/dev/null 2>&1; then
            echo "::notice::${TAG} is already on npm. Nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.npm.outputs.published != 'true'
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.npm.outputs.published != 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.npm.outputs.published != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.npm.outputs.published != 'true'
        run: pnpm install --filter "${{ steps.package.outputs.name }}..." --frozen-lockfile --ignore-scripts

      - name: Build
        if: steps.npm.outputs.published != 'true'
        run: pnpm --filter "${{ steps.package.outputs.name }}..." build

      - name: Test
        if: steps.npm.outputs.published != 'true'
        run: pnpm --filter "${{ steps.package.outputs.name }}" test

      # pnpm replaces workspace: ranges with the released versions.
      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: pnpm --filter "${{ steps.package.outputs.name }}" publish --access public --provenance --no-git-checks
